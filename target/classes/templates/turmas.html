<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Turmas')}"></head>
<body class="font-sans antialiased">
<div class="min-h-screen bg-[#e8f0ef] flex">

    <th:block th:replace="~{fragments/layout :: sidebar}"></th:block>

    <div class="flex-1 flex flex-col min-w-0">
        <header th:replace="~{fragments/layout :: header('Cursos', 'Gestão de Turmas')}"></header>

        <main class="flex-1 p-4 lg:p-6 overflow-y-auto">

            <div th:if="${sucesso}" class="mb-4 p-4 rounded-xl text-sm bg-green-50 text-green-700 border-l-4 border-green-500 shadow-sm">
                <span th:text="${sucesso}">Sucesso</span>
            </div>
            <div th:if="${erro}" class="mb-4 p-4 rounded-xl text-sm bg-red-50 text-red-700 border-l-4 border-red-500 shadow-sm">
                <span th:text="${erro}">Erro</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white rounded-2xl p-5 shadow-sm md:col-span-2 flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">Turmas de Costura & Artesanato</h2>
                        <p class="text-xs text-gray-500 mt-1">Gerencie horários, instrutoras, vagas e mensalidades das turmas do ateliê.</p>
                    </div>
                    <button type="button" onclick="document.getElementById('modal-turma').classList.remove('hidden')"
                            class="flex items-center gap-2 px-4 py-2.5 bg-[#2d6a6a] text-white rounded-full text-sm font-medium hover:bg-[#245858] hover:scale-105 transition-all shadow-sm">
                        <i data-lucide="plus" class="w-4 h-4"></i> Nova Turma
                    </button>
                </div>

                <div class="bg-white rounded-2xl p-5 shadow-sm flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-[#2d6a6a]/10 flex items-center justify-center text-[#2d6a6a]">
                        <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <span class="text-xs text-gray-500">Turmas Ativas</span>
                        <p class="text-2xl font-bold text-gray-800" th:text="${totalAtivas}">0</p>
                    </div>
                </div>
            </div>

            <!-- Edição -->
            <div th:if="${turmaEmEdicao}" class="bg-amber-50/70 border border-amber-200 rounded-2xl p-6 mb-6 shadow-sm">
                <form th:action="@{/turmas/salvar}" method="post" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-3">
                    <input type="hidden" name="id" th:value="${turmaEmEdicao.id}">
                    <div class="lg:col-span-2">
                        <label class="block text-xs text-gray-600 mb-1">Nome da Turma</label>
                        <input type="text" name="nome" th:value="${turmaEmEdicao.nome}" required class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Instrutora</label>
                        <input type="text" name="instrutora" th:value="${turmaEmEdicao.instrutora}" required class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Horário</label>
                        <input type="text" name="horario" th:value="${turmaEmEdicao.horario}" required class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Vagas</label>
                        <input type="number" name="vagasTotais" th:value="${turmaEmEdicao.vagasTotais}" min="1" required class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Mensalidade (R$)</label>
                        <input type="number" step="0.01" name="valorMensalidade" th:value="${turmaEmEdicao.valorMensalidade}" required class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm">
                    </div>
                    <div class="lg:col-span-6 flex items-center justify-between mt-2">
                        <label class="inline-flex items-center gap-2 text-sm text-gray-700">
                            <input type="checkbox" name="ativa" value="true" th:checked="${turmaEmEdicao.ativa}">
                            <span>Turma Ativa</span>
                        </label>
                        <div class="flex gap-2">
                            <a th:href="@{/turmas}" class="px-4 py-2 bg-gray-200 text-gray-700 text-xs rounded-lg">Cancelar</a>
                            <button type="submit" class="px-5 py-2 bg-[#2d6a6a] text-white text-xs font-semibold rounded-lg">Salvar</button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                        <tr class="border-b border-gray-100 text-xs font-semibold text-gray-500 uppercase">
                            <th class="py-3 px-4">Turma</th>
                            <th class="py-3 px-4">Instrutora</th>
                            <th class="py-3 px-4">Horário</th>
                            <th class="py-3 px-4">Vagas</th>
                            <th class="py-3 px-4">Mensalidade</th>
                            <th class="py-3 px-4">Status</th>
                            <th class="py-3 px-4 text-right">Ações</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-50 text-sm">
                        <tr th:each="t : ${turmas}" class="hover:bg-gray-50">
                            <td class="py-3 px-4 font-medium text-gray-800" th:text="${t.nome}">Turma</td>
                            <td class="py-3 px-4 text-gray-600" th:text="${t.instrutora}">Instrutora</td>
                            <td class="py-3 px-4 text-gray-500 text-xs" th:text="${t.horario}">Horário</td>
                            <td class="py-3 px-4 text-gray-700 font-semibold" th:text="${t.vagasTotais}">12</td>
                            <td class="py-3 px-4 text-[#2d6a6a] font-semibold" th:text="${formatadorMoeda.formatar(t.valorMensalidade)}">R$ 280,00</td>
                            <td class="py-3 px-4">
                                <span th:if="${t.ativa}" class="px-2.5 py-1 rounded-full text-xs font-medium bg-green-50 text-green-700">Ativa</span>
                                <span th:unless="${t.ativa}" class="px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-500">Encerrada</span>
                            </td>
                            <td class="py-3 px-4 text-right space-x-2">
                                <a th:href="@{/turmas(editar=${t.id})}" class="inline-flex p-2 rounded-lg text-gray-600 hover:text-[#2d6a6a] hover:bg-gray-100">
                                    <i data-lucide="pencil" class="w-4 h-4"></i>
                                </a>
                                <form th:action="@{'/turmas/excluir/' + ${t.id}}" method="post" class="inline"
                                      onsubmit="return confirm('Deseja excluir esta turma?');">
                                    <button type="submit" class="inline-flex p-2 rounded-lg text-gray-400 hover:text-red-600 hover:bg-red-50">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modal Nova Turma -->
            <div id="modal-turma" class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center hidden p-4">
                <div class="bg-white rounded-2xl p-6 w-full max-w-lg shadow-xl">
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-gray-100">
                        <h3 class="text-lg font-bold text-gray-800">Nova Turma</h3>
                        <button type="button" onclick="document.getElementById('modal-turma').classList.add('hidden')" class="p-1 hover:bg-gray-100 rounded-lg">
                            <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
                        </button>
                    </div>
                    <form th:action="@{/turmas/salvar}" method="post" class="space-y-4">
                        <input type="hidden" name="ativa" value="true">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Nome da Turma *</label>
                            <input type="text" name="nome" placeholder="Ex: Costura Avançada - Noite" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Instrutora *</label>
                                <input type="text" name="instrutora" value="Renata D'Amore" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Horário *</label>
                                <input type="text" name="horario" placeholder="Ex: Ter/Qui 19h às 21h" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Total de Vagas *</label>
                                <input type="number" name="vagasTotais" min="1" value="10" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Mensalidade (R$) *</label>
                                <input type="number" step="0.01" name="valorMensalidade" value="320.00" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm">
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
                            <button type="button" onclick="document.getElementById('modal-turma').classList.add('hidden')" class="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-full text-sm">Cancelar</button>
                            <button type="submit" class="px-6 py-2.5 bg-[#2d6a6a] text-white rounded-full text-sm font-medium">Criar Turma</button>
                        </div>
                    </form>
                </div>
            </div>

        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
