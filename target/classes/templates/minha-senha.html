<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Alterar Minha Senha')}"></head>
<body class="font-sans antialiased">
<div class="min-h-screen bg-[#e8f0ef] flex">

    <th:block th:replace="~{fragments/layout :: sidebar}"></th:block>

    <div class="flex-1 flex flex-col min-w-0">
        <header th:replace="~{fragments/layout :: header('Minha Conta', 'Alterar Senha de Acesso')}"></header>

        <main class="flex-1 p-4 lg:p-6 overflow-y-auto">

            <div th:if="${sucesso}" class="mb-4 p-4 rounded-xl text-sm bg-green-50 text-green-700 border-l-4 border-green-500 shadow-sm max-w-2xl">
                <span th:text="${sucesso}">Sucesso</span>
            </div>
            <div th:if="${erro}" class="mb-4 p-4 rounded-xl text-sm bg-red-50 text-red-700 border-l-4 border-red-500 shadow-sm max-w-2xl">
                <span th:text="${erro}">Erro</span>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-4xl">
                <!-- Cartão de Perfil do Funcionário -->
                <div class="bg-white rounded-2xl p-6 shadow-sm flex flex-col items-center text-center">
                    <div class="w-16 h-16 bg-[#2d6a6a] rounded-full flex items-center justify-center text-white text-2xl font-serif italic mb-3"
                         th:text="${usuarioLogado.iniciais}">F</div>
                    <h2 class="text-base font-bold text-gray-800" th:text="${usuarioLogado.nome}">Nome do Funcionário</h2>
                    <p class="text-xs text-gray-500 mt-0.5" th:if="${dadosFuncionario != null}" th:text="${dadosFuncionario.cargo}">Cargo</p>

                    <span class="mt-3 px-3 py-1 rounded-full text-xs font-medium bg-[#2d6a6a]/10 text-[#2d6a6a]"
                          th:text="${usuarioLogado.perfil.descricao}">Funcionário(a)</span>

                    <div class="w-full mt-6 pt-4 border-t border-gray-100 text-left space-y-2 text-xs text-gray-600">
                        <div class="flex justify-between">
                            <span class="text-gray-400">Login:</span>
                            <span class="font-mono font-semibold text-gray-700" th:text="${usuarioLogado.login}">login</span>
                        </div>
                        <div class="flex justify-between" th:if="${dadosFuncionario != null and dadosFuncionario.dataNascimento != null}">
                            <span class="text-gray-400">Nascimento:</span>
                            <span th:text="${#temporals.format(dadosFuncionario.dataNascimento, 'dd/MM/yyyy')}">01/01/1995</span>
                        </div>
                    </div>
                </div>

                <!-- Formulário de Troca de Senha -->
                <div class="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm">
                    <div class="flex items-center gap-2.5 mb-2">
                        <div class="w-9 h-9 rounded-xl bg-[#2d6a6a]/10 text-[#2d6a6a] flex items-center justify-center">
                            <i data-lucide="key-round" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-gray-800">Trocar Senha de Acesso</h3>
                            <p class="text-xs text-gray-500">Informe sua senha atual e escolha uma nova senha pessoal.</p>
                        </div>
                    </div>

                    <form th:action="@{/minha-senha}" method="post" class="space-y-4 mt-5">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Senha Atual *</label>
                            <input type="password" name="senhaAtual" required placeholder="Digite sua senha atual"
                                   class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#2d6a6a]/30">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Nova Senha * (mín. 4 caracteres)</label>
                                <input type="password" name="novaSenha" minlength="4" required placeholder="Digite a nova senha"
                                       class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#2d6a6a]/30">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Confirmar Nova Senha *</label>
                                <input type="password" name="confirmacaoSenha" minlength="4" required placeholder="Repita a nova senha"
                                       class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#2d6a6a]/30">
                            </div>
                        </div>

                        <div class="flex justify-end pt-4 border-t border-gray-100">
                            <button type="submit"
                                    class="inline-flex items-center gap-2 px-6 py-2.5 bg-[#2d6a6a] text-white rounded-full text-sm font-medium hover:bg-[#245858] transition-all shadow-sm">
                                <i data-lucide="check" class="w-4 h-4"></i> Atualizar Minha Senha
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
