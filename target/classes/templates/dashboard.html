<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body class="font-sans antialiased">
<div class="min-h-screen bg-[#e8f0ef] flex">

    <th:block th:replace="~{fragments/layout :: sidebar}"></th:block>

    <div class="flex-1 flex flex-col min-w-0">
        <header th:replace="~{fragments/layout :: header('Dashboard', 'Visão Geral')}"></header>

        <main class="flex-1 p-4 lg:p-6 overflow-y-auto">

            <!-- Ações rápidas -->
            <div class="flex flex-wrap gap-3 mb-6">
                <a th:href="@{/vendas}" class="flex items-center gap-2 px-4 py-2 bg-[#2d6a6a] text-white rounded-full text-sm font-medium hover:bg-[#245858] hover:scale-105 transition-all">
                    <i data-lucide="plus" class="w-4 h-4"></i> Nova Venda
                </a>
                <a th:href="@{/estoque}" class="flex items-center gap-2 px-4 py-2 bg-white text-[#2d6a6a] border border-[#2d6a6a] rounded-full text-sm font-medium hover:bg-[#2d6a6a]/5 hover:scale-105 transition-all">
                    <i data-lucide="plus" class="w-4 h-4"></i> Novo Material
                </a>
                <a th:href="@{/turmas}" class="flex items-center gap-2 px-4 py-2 bg-white text-[#2d6a6a] border border-[#2d6a6a] rounded-full text-sm font-medium hover:bg-[#2d6a6a]/5 hover:scale-105 transition-all">
                    <i data-lucide="plus" class="w-4 h-4"></i> Nova Turma
                </a>
                <a th:href="@{/alunos}" class="flex items-center gap-2 px-4 py-2 bg-white text-[#2d6a6a] border border-[#2d6a6a] rounded-full text-sm font-medium hover:bg-[#2d6a6a]/5 hover:scale-105 transition-all">
                    <i data-lucide="plus" class="w-4 h-4"></i> Novo Aluno
                </a>
            </div>

            <!-- Cartões de indicadores: gerados a partir da List<IndicadorDashboard> -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4 mb-6">
                <div th:each="cartao : ${painel.cartoes}" class="bg-white rounded-2xl p-4 shadow-sm">
                    <div class="flex items-center justify-between mb-2">
                        <i th:attr="data-lucide=${cartao.icone}" class="w-6 h-6 text-[#2d6a6a]"></i>
                        <span class="text-xs flex items-center gap-1"
                              th:classappend="${cartao.variacao.positiva} ? 'text-green-600' : (${cartao.variacao.negativa} ? 'text-red-500' : 'text-gray-500')">
                            <i th:if="${cartao.variacao.positiva}" data-lucide="trending-up" class="w-3 h-3"></i>
                            <i th:if="${cartao.variacao.negativa}" data-lucide="trending-down" class="w-3 h-3"></i>
                            <span th:text="${cartao.variacao.texto}">0%</span>
                        </span>
                    </div>
                    <p class="text-2xl font-bold text-gray-800" th:text="${cartao.valor}">0</p>
                    <p class="text-xs text-gray-500" th:text="${cartao.titulo}">Título</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
                <!-- Gráfico de vendas -->
                <div class="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Vendas por Mês</h3>
                    <div class="h-64 flex items-end justify-between gap-2">
                        <div th:each="barra : ${painel.grafico}" class="flex-1 flex flex-col items-center gap-2">
                            <div class="w-full bg-[#2d6a6a] rounded-t-lg transition-all hover:bg-[#245858]"
                                 th:style="'height:' + ${barra.alturaPx} + 'px'"
                                 th:title="${barra.valorFormatado}"></div>
                            <span class="text-xs text-gray-500" th:text="${barra.mes}">Mês</span>
                        </div>
                    </div>
                </div>

                <!-- Alertas -->
                <div class="bg-white rounded-2xl p-6 shadow-sm">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
                        <i data-lucide="triangle-alert" class="w-5 h-5 text-amber-500"></i> Alertas
                    </h3>
                    <div class="space-y-3 max-h-64 overflow-y-auto">
                        <div th:each="alerta : ${painel.alertas}" class="p-3 rounded-lg text-sm border-l-4"
                             th:classappend="${alerta.alta} ? 'bg-red-50 text-red-700 border-red-500' : 'bg-amber-50 text-amber-700 border-amber-500'">
                            <div class="flex items-start gap-2">
                                <i data-lucide="triangle-alert" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
                                <span th:text="${alerta.mensagem}">Mensagem</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Vendas recentes -->
            <div class="bg-white rounded-2xl p-6 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-800">Vendas Recentes</h3>
                    <a th:href="@{/vendas}" class="text-sm text-[#2d6a6a] hover:underline">Ver todas</a>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                        <tr class="border-b border-gray-100">
                            <th class="text-left py-3 px-4 text-xs font-semibold text-gray-500 uppercase">Produto</th>
                            <th class="text-left py-3 px-4 text-xs font-semibold text-gray-500 uppercase">Cliente</th>
                            <th class="text-left py-3 px-4 text-xs font-semibold text-gray-500 uppercase">Valor</th>
                            <th class="text-left py-3 px-4 text-xs font-semibold text-gray-500 uppercase">Data</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="venda : ${painel.vendasRecentes}" class="border-b border-gray-50 hover:bg-gray-50 transition-colors">
                            <td class="py-3 px-4"><span class="font-medium text-gray-800" th:text="${venda.produto}">Produto</span></td>
                            <td class="py-3 px-4 text-gray-600" th:text="${venda.cliente}">Cliente</td>
                            <td class="py-3 px-4 text-[#2d6a6a] font-semibold" th:text="${venda.valor}">R$ 0,00</td>
                            <td class="py-3 px-4 text-gray-500 text-sm" th:text="${venda.data}">01/01/2024</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
